[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fcaz"
dynamic = ["version"]
description = "Property and Casualty Actuarial Modeling"
readme = "README.md"
authors = [{ name = "Gene Dan", email = "genedan@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["scipy"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "twine"
]
docs = [
    "sphinx",
    "pydata-sphinx-theme"
]

[project.urls]
Homepage = "https://github.com/casact/fcaz"
Documentation = "https://casact.github.io/fcaz"

[tool.setuptools.packages.find]
include = ["fcaz*"]

[tool.setuptools.dynamic]
version = { attr = "fcaz.constants.BUILD_VERSION" }

[tool.coverage.run]
source = ["fcaz"]
branch = true

[tool.coverage.report]
show_missing = true
